<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Davinci Wiki</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("davinci-theme");
          var t = s || "system";
          var r =
            t === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : t;
          var c = document.documentElement.classList;
          c.remove("light", "dark");
          c.add(r);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
